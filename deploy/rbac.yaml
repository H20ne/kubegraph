# RBAC lecture seule pour kubegraph.
#
# Principe : l'outil ne fait QUE lire (get/list/watch). Aucun verbe d'écriture
# (create/update/patch/delete) n'est demandé. Un ClusterRole est utilisé car
# l'outil liste les ressources de tous les namespaces.
#
# Ces manifestes conviennent aux deux modèles :
#   - central : le hub utilise le token de ce ServiceAccount via un kubeconfig.
#   - hub-spoke : l'agent tourne dans le cluster et monte ce SA (repli in-cluster).
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubegraph
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubegraph
  namespace: kubegraph
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubegraph-readonly
rules:
  # Cœur : Pods, Services, ConfigMaps (les ConfigMaps servent au scan des
  # dépendances de config), Namespaces (labels pour les namespaceSelector des
  # NetworkPolicies). NB : on ne demande PAS "secrets" — les secrets utilisés
  # sont déduits des specs des workloads, sans jamais lire leurs valeurs.
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "namespaces", "persistentvolumeclaims", "persistentvolumes", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  # RBAC : Roles, ClusterRoles et leurs bindings (« qui peut quoi »). LECTURE
  # SEULE. NB : on ne demande TOUJOURS PAS "secrets" — les secrets utilisés sont
  # déduits des specs des workloads (noms seuls), jamais lus (`.data` inaccessible).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # Workloads : Deployments, ReplicaSets, StatefulSets, DaemonSets.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Travail ponctuel/planifié : Jobs, CronJobs.
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Scaling natif : HorizontalPodAutoscaler.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # Résilience : PodDisruptionBudget.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # Réseau : Ingresses + NetworkPolicies (base déclarée pour la détection de dérive).
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # KEDA : dépendances de scaling (cross-namespace). Optionnel — si KEDA n'est
  # pas installé, l'outil fonctionne sans (la lecture échoue en silence).
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "scaledjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubegraph-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubegraph-readonly
subjects:
  - kind: ServiceAccount
    name: kubegraph
    namespace: kubegraph
